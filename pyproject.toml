[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semdiff"
version = "0.0.0"
description = "Semantic HTML change detection: two snapshots in, typed change objects out."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AmitKumar-24" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    # Unpinned again at T-25. 0.4.x and 1.0.x disagree on how they spell a spec-adjusted
    # foreign-content attribute key (viewbox vs viewBox), which switched canonical.attr_order
    # off for every <svg> on 1.0.0 (F-027); the rule now reads the key case-insensitively and
    # both lines produce byte-identical normalized output, pinned by tests/corpus against
    # recorded digests. CI runs 0.4.13 and 1.0.0 explicitly, plus a weekly unpinned check.
    # What still differs between them is a Locator.node_hash on foreign content, which is why
    # a result names its parser build (D-046).
    "selectolax>=0.4.11",
    "pydantic>=2",
]

[project.scripts]
semdiff = "semdiff.cli:main"

[project.optional-dependencies]
content = ["trafilatura"]
ml = ["sentence-transformers"]
all = ["semdiff[content,ml]"]
# lxml is a development dependency, not a core one: nothing under src/semdiff imports it, and
# tests/baseline measures SemDiff against lxml.html.diff for the published comparison (T-22).
# It returns to the core install with the release that first imports it -- the second parser
# backend, which FR-2 reserves and D-048 deferred out of v0.1.
dev = ["pytest", "mypy", "lxml"]

[tool.hatch.build.targets.wheel]
packages = ["src/semdiff"]

[tool.hatch.build.targets.sdist]
exclude = ["corpus/", "tests/", ".github/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
