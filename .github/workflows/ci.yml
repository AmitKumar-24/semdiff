name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays: catch a new selectolax release within a week (T-25)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # Exact versions, never a range: a pull request's result must not depend on what PyPI
        # served that morning. The two lines spell a spec-adjusted foreign-content attribute
        # key differently, which is why both are covered (F-027, D-046).
        selectolax: ["0.4.13", "1.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pin the parser under test
        run: python -m pip install "selectolax==${{ matrix.selectolax }}"
      - name: Record the environment
        run: |
          python -c "import importlib.metadata as m; print('selectolax', m.version('selectolax'))"
          python -c "import semdiff; print(semdiff.parser_fingerprint())"
      - name: Tests (unit + corpus suite)
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy --strict src/semdiff tests

  package:
    # Packaging had no CI coverage at all, so a break would have surfaced at release time
    # (D-050). This builds what the release workflow builds and checks it the same way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the metadata
        run: python -m twine check --strict dist/*
      - name: Verify the sdist contents (F-004, D-050)
        run: python scripts/check_sdist.py dist/*.tar.gz
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/python -m pip list
      - name: Smoke-test the installed package
        # The same script the release workflow runs, so the two cannot drift: distribution
        # name, version agreement, py.typed, the API, the command, and no dev dependency.
        run: |
          /tmp/clean/bin/python scripts/smoke_install.py
      - name: The core closure resolves to wheels (NFR-9)
        run: |
          python -m pip install --only-binary :all: --dry-run dist/*.whl

  latest-parser:
    # Unpinned on purpose, and scheduled only: a new selectolax release should surface here,
    # never in someone's pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Upgrade to the newest selectolax
        run: python -m pip install --upgrade selectolax
      - name: Record the environment
        run: python -c "import semdiff; print(semdiff.parser_fingerprint())"
      - name: Tests (unit + corpus suite)
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy --strict src/semdiff tests
